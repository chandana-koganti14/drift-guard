<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Drift Guard</title>
  <desc id="desc">A compass whose needle turns away from a faded old path toward a fresh one.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A4A"/>
      <stop offset="1" stop-color="#0E1528"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- old path: faded, drifting off to the left -->
  <path d="M256 430 C 230 360, 150 330, 120 250" fill="none" stroke="#5B6B94" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="2 30" opacity="0.75"/>

  <!-- compass ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#E8ECF7" stroke-width="16" opacity="0.95"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="#E8ECF7" stroke-width="3" opacity="0.25"/>

  <!-- tick marks -->
  <g stroke="#E8ECF7" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="118" x2="256" y2="140"/>
    <line x1="256" y1="372" x2="256" y2="394"/>
    <line x1="118" y1="256" x2="140" y2="256"/>
    <line x1="372" y1="256" x2="394" y2="256"/>
  </g>

  <!-- needle: bright half points to the fresh direction (up-right), dim half back -->
  <g transform="rotate(35 256 256)">
    <path d="M256 150 L284 256 L228 256 Z" fill="url(#needle)"/>
    <path d="M256 362 L284 256 L228 256 Z" fill="#8C9AC0" opacity="0.6"/>
  </g>
  <circle cx="256" cy="256" r="16" fill="#E8ECF7"/>
  <circle cx="256" cy="256" r="6" fill="#1E2A4A"/>

  <!-- fresh start spark, where the needle points -->
  <g transform="translate(382 120)" fill="#FFD166">
    <path d="M0 -30 L8 -8 L30 0 L8 8 L0 30 L-8 8 L-30 0 L-8 -8 Z"/>
  </g>
</svg>
